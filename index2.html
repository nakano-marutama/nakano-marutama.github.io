<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>スケジュール確認</title>
<style>
    /* ページの表示を整えるためのCSS */
    body { font-family: sans-serif; margin: 20px; }
    h1 { color: #333; }
    /* 更新ボタンのスタイル */
    #reloadButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    table { border-collapse: collapse; width: 100%; max-width: 1200px; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 11pt; white-space: nowrap; } 
    /* ヘッダー固定 */
    th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
    .name-cell { text-align: left; font-weight: bold; } /* 氏名セル */
    /* 休み（/）のセルを強調 */
    .vacation-cell { background-color: #ffdddd; font-weight: bold; } 
    /* 日付行のヘッダー色 */
    .date-row th { 
        background-color: #cccccc; 
        padding-top: 4px; 
        padding-bottom: 4px;
    } 
</style>
</head>
<body>
    <h1 id="mainTitle">スケジュールを読み込み中...</h1>
    
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div id="scheduleTable">データを読み込み中...</div>

<script>
    // 🌟 【重要】ウェブに公開したCSV形式のURLに置き換えてください
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSyErOQl5eRjOsCvSthxVrKvFmKhsHhdvlBngpAatcMOC4Cn1NP673R51kNx7QgJFD9t3lx33XOvP8Z/pub?gid=1072672730&single=true&output=csv'; 
    
    // ----------------------------------------------------------------------
    // ページロード時とボタンクリック時に実行されるメインの処理を関数化
    // ----------------------------------------------------------------------
    function fetchDataAndDisplay() {
        document.getElementById('mainTitle').textContent = 'データを読み込み中...';
        document.getElementById('scheduleTable').innerHTML = 'データを読み込み中...';
        
        fetchDataFromCSV(PUBLIC_CSV_URL)
            .then(data => {
                if (data.error) {
                    showError({ message: data.error });
                } else {
                    displayData(data);
                }
            })
            .catch(error => {
                showError({ message: `データの読み込みに失敗しました: ${error.message}` });
            });
    }

    // ページが読み込まれたら、公開 CSV のデータを読み込む
    window.onload = function() {
        fetchDataAndDisplay();
        
        // 更新ボタンにイベントリスナーを設定
        document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
    };

    /**
     * CSVテキストを正しく配列に変換するプロフェッショナルなパース関数
     * セル内の改行やカンマ、ダブルクォーテーションに対応
     */
    function parseCSV(text) {
        const lines = [];
        let inQuotes = false;
        let start = 0;
        for (let i = 0; i < text.length; i++) {
            if (text[i] === '"') inQuotes = !inQuotes;
            if (!inQuotes && (text.substring(i, i + 1) === '\n' || text.substring(i, i + 2) === '\r\n')) {
                lines.push(text.substring(start, i));
                start = i + (text[i] === '\r' ? 2 : 1);
            }
        }
        lines.push(text.substring(start));

        const re = /(?!\s*$)\s*(?:'([^']*)'|"([^"]*)"|([^,\r\n\t]*))\s*(?:,|$)/g;
        return lines.map(line => {
            const row = [];
            let m;
            re.lastIndex = 0; 
            while (m = re.exec(line)) {
                let val = m[1] || m[2] || m[3] || "";
                row.push(val.trim());
            }
            return row;
        });
    }

    /**
     * 公開 CSV URL からデータを取得し、構造化されたオブジェクトに変換する関数
     */
    async function fetchDataFromCSV(url) {
        try {
            const cacheBuster = url.indexOf('?') > -1 ? `&t=${Date.now()}` : `?t=${Date.now()}`;
            const response = await fetch(url + cacheBuster);
            
            if (!response.ok) {
                throw new Error(`HTTPエラー: ${response.status} - 公開URLの確認が必要です。`);
            }
            const csvText = await response.text();

            const rows = parseCSV(csvText);
            
            if (rows.length < 6) {
                return { error: 'CSVデータが期待される行数に満たないため、パースできませんでした。スプレッドシートが正しく公開されているか確認してください。' };
            }

            // 【修正箇所】B2(rows[1][1]) の値のみを取得してタイトルに使用
            let monthVal = (rows[1] && rows[1][1]) ? rows[1][1].trim() : "不明な月";
            
            const dateHeader = rows[4] ? rows[4].map(cell => cell.trim()) : []; 
            const header = rows[5] ? rows[5].map(cell => cell.trim()) : []; 
            
            const dataBody = rows.slice(6) 
                .filter(row => row[1] && row[1].trim() !== '')
                .map(row => row.map(cell => cell.trim()));

            return {
                month: monthVal, 
                dateHeader: dateHeader, 
                header: header, 
                data: dataBody 
            };

        } catch (e) {
            return { error: `CSVパース処理中にエラーが発生しました: ${e.message}` };
        }
    }

    /**
     * 取得したデータをHTMLテーブルとして表示する関数
     */
    function displayData(scheduleData) {
        const tableDiv = document.getElementById('scheduleTable');
        if (!scheduleData || !scheduleData.data.length) {
            tableDiv.innerHTML = '<p>表示するデータがありません。</p>';
            return;
        }
        
        document.getElementById('mainTitle').textContent = `${scheduleData.month} 休み希望確認`; 
        
        let html = '<table><thead>';
        
        html += '<tr class="date-row">';
        scheduleData.dateHeader.forEach(d => {
            const displayValue = d || '';
            html += `<th>${displayValue}</th>`;
        });
        html += '</tr>';

        html += '<tr>';
        scheduleData.header.forEach(h => {
            const displayValue = h || '';
            html += `<th>${displayValue}</th>`;
        });
        html += '</tr></thead>';
        
        html += '<tbody>';
        scheduleData.data.forEach(row => {
            html += '<tr>';
            row.forEach((cell, cellIndex) => {
                const cellTextStr = cell.toString().replace(/\n/g, '<br>');
                
                if (cellIndex === 0) {
                    html += `<td class="name-cell">${cellTextStr}</td>`;
                } else {
                    const cellClass = cell === '/' ? ' class="vacation-cell"' : ''; 
                    html += `<td${cellClass}>${cellTextStr}</td>`; 
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        tableDiv.innerHTML = html;
    }
    
    function showError(error) {
        document.getElementById('mainTitle').textContent = '🚨 データ取得エラー';
        document.getElementById('scheduleTable').innerHTML = 
            `<p style="color: red; font-size: 14pt;">🚨 データ取得エラーが発生しました 🚨</p>
             <p>以下の点を確認してください:</p>
             <ul>
               <li>スプレッドシートが**「ファイル」→「共有」→「ウェブに公開」**で**CSV形式**で公開されているか</li>
               <li>HTML内の **PUBLIC_CSV_URL** が正しいURLに置き換わっているか</li>
               <li>エラーメッセージ: ${error.message}</li>
             </ul>`;
    }
</script>
</body>
</html>
