<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール確認</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 10px; }
        #reloadButton {
            padding: 10px 20px; font-size: 16px; cursor: pointer; margin-bottom: 20px;
            background-color: #4CAF50; color: white; border: none; border-radius: 5px;
        }
        .table-container { overflow-x: auto; border: 1px solid #ccc; background-color: white; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: center; font-size: 10pt; white-space: nowrap; } 
        th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
        .date-row th { background-color: #cccccc; } 
        .name-cell { text-align: left; font-weight: bold; background-color: #fdfdfd; padding-left: 15px; } 
        .vacation-cell { background-color: #ffdddd; font-weight: bold; color: #d32f2f; }
        /* 合計行（総労働時間）を目立たせる */
        .total-row { background-color: #eee; font-weight: bold; }
    </style>
</head>
<body>
    <h1 id="mainTitle">データを読み込み中...</h1>
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div class="table-container">
        <div id="scheduleTable"></div>
    </div>

<script>
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT20u42P9--VV9FuP3y0JpMiqZyAAyDWgmn-EcW5Hnacjm0wjT8kIb2dVOLLzLXTbqWmzR-vGplYxF-/pub?gid=0&single=true&output=csv'; 

    async function fetchDataAndDisplay() {
        const titleEl = document.getElementById('mainTitle');
        const tableEl = document.getElementById('scheduleTable');
        titleEl.textContent = '読み込み中...';

        try {
            const response = await fetch(`${PUBLIC_CSV_URL}&t=${new Date().getTime()}`);
            const csvText = await response.text();
            const rows = csvText.trim().split(/\r?\n/).map(row => row.split(','));

            // --- 1. タイトル取得 (A2 と B2) ---
            const yearText = rows[1][0] ? rows[1][0].trim() : "";
            const monthText = rows[1][1] ? rows[1][1].trim() : "";
            titleEl.textContent = `${yearText} ${monthText} 休み希望確認`;

            // --- 2. テーブル生成 ---
            // 列数はデータの最大数に合わせる（固定値33を廃止）
            const maxCols = rows[3].length;

            let html = '<table><thead>';
            
            // 日付行 (rows[3])
            html += '<tr class="date-row">';
            rows[3].forEach(cell => html += `<th>${cell || ''}</th>`);
            html += '</tr>';

            // 曜日行 (rows[4])
            html += '<tr>';
            rows[4].forEach(cell => html += `<th>${cell || ''}</th>`);
            html += '</tr></thead><tbody>';

            // データ本体 (rows[5]以降)
            const bodyRows = rows.slice(5).filter(row => row[1] && row[1].trim() !== "");

            bodyRows.forEach(row => {
                const isTotalRow = row[0].includes("総労働時間");
                html += `<tr class="${isTotalRow ? 'total-row' : ''}">`;
                
                row.forEach((cell, idx) => {
                    const text = cell ? cell.trim() : "";
                    if (idx === 0 || idx === 1) {
                        html += `<td class="name-cell">${text}</td>`;
                    } else {
                        const style = text === "/" ? ' class="vacation-cell"' : '';
                        html += `<td${style}>${text}</td>`;
                    }
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            tableEl.innerHTML = html;

        } catch (e) {
            titleEl.textContent = '🚨 エラー';
            tableEl.innerHTML = `<p style="color:red">${e.message}</p>`;
        }
    }

    window.onload = fetchDataAndDisplay;
    document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
</script>
</body>
</html>
