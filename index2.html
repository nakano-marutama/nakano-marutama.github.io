<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>スケジュール確認</title>
<style>
    /* ページの表示を整えるためのCSS */
    body { font-family: sans-serif; margin: 20px; }
    h1 { color: #333; }
    /* 更新ボタンのスタイル */
    #reloadButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    table { border-collapse: collapse; width: 100%; max-width: 1500px; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 10pt; white-space: nowrap; } 
    /* ヘッダー固定 */
    th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
    .name-cell { text-align: left; font-weight: bold; background-color: #f9f9f9; } /* 氏名セル */
    /* 休み（/）のセルを強調 */
    .vacation-cell { background-color: #ffdddd; font-weight: bold; } 
    /* 日付行のヘッダー色 */
    .date-row th { 
        background-color: #cccccc; 
        padding-top: 4px; 
        padding-bottom: 4px;
    } 
</style>
</head>
<body>
    <h1 id="mainTitle">スケジュールを読み込み中...</h1>
    
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div id="scheduleTable">データを読み込み中...</div>

<script>
    // 🌟 正しいCSV形式のURL
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaYJphnZhb8HkeovOamN2R_LJ9GImdQr8fD_uRqWyFJ0N_JJi3okCjunHA1aFGajXz9MykXYRZYS4K/pub?gid=0&single=true&output=csv'; 
    
    function fetchDataAndDisplay() {
        document.getElementById('mainTitle').textContent = 'データを読み込み中...';
        document.getElementById('scheduleTable').innerHTML = 'データを読み込み中...';
        
        fetch(PUBLIC_CSV_URL + '?t=' + Date.now())
            .then(res => res.text())
            .then(csvText => {
                // CSVを行と列に分割（引用符を削除）
                const rows = csvText.trim().split('\n').map(row => 
                    row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim())
                );
                
                if (rows.length < 5) {
                    showError({ message: 'CSVデータの行数が足りません。' });
                    return;
                }

                // 【月度の取得】1行目のどこかに含まれる数字を探す
                let monthLabel = "不明な月";
                const firstRowCombined = rows[0].join('');
                const m = firstRowCombined.match(/\d+/);
                if (m) {
                    monthLabel = m[0].padStart(2, '0') + "月度";
                }

                // 【名前列の特定】5行目(index 4)から "名前" を探す
                let nameColIndex = 1; // 見つからない場合はB列(1)をデフォルトにする
                for (let i = 0; i < rows[4].length; i++) {
                    if (rows[4][i] === "名前") {
                        nameColIndex = i;
                        break;
                    }
                }

                // 【ヘッダーとデータの抽出】名前列を起点に抽出
                const dateHeader = rows[3].slice(nameColIndex); // 4行目（日付）
                const dayHeader = rows[4].slice(nameColIndex);  // 5行目（曜日/名前）
                
                // 6行目以降から名前が入っている行だけを抽出
                const bodyData = rows.slice(5)
                    .filter(row => row[nameColIndex] && row[nameColIndex] !== "");

                displayData(monthLabel, dateHeader, dayHeader, bodyData, nameColIndex);
            })
            .catch(error => {
                showError({ message: `データの読み込みに失敗しました: ${error.message}` });
            });
    }

    function displayData(month, dates, days, data, nameIdx) {
        document.getElementById('mainTitle').textContent = `${month} 休み希望確認`; 
        
        let html = '<table><thead><tr class="date-row">';
        // 日付行
        dates.forEach(d => html += `<th>${d || ''}</th>`);
        html += '</tr><tr>';
        // 曜日・名前行
        days.forEach(h => html += `<th>${h || ''}</th>`);
        html += '</tr></thead><tbody>';
        
        // データ本体
        data.forEach(row => {
            html += '<tr>';
            // 名前列から後ろだけを表示
            const displayCells = row.slice(nameIdx);
            displayCells.forEach((cell, i) => {
                const cellText = cell.replace(/\n/g, '<br>');
                if (i === 0) {
                    // 1つ目のセルは「名前」
                    html += `<td class="name-cell">${cellText}</td>`;
                } else {
                    // 2つ目以降はスケジュール（/ を強調）
                    const cellClass = cell === '/' ? ' class="vacation-cell"' : ''; 
                    html += `<td${cellClass}>${cellText}</td>`; 
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        document.getElementById('scheduleTable').innerHTML = html;
    }

    function showError(error) {
        document.getElementById('mainTitle').textContent = '🚨 データ取得エラー';
        document.getElementById('scheduleTable').innerHTML = `<p>${error.message}</p>`;
    }

    window.onload = fetchDataAndDisplay;
    document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
</script>
</body>
</html>
