<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>スケジュール確認</title>
<style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { color: #333; }
    #reloadButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    table { border-collapse: collapse; width: 100%; max-width: 1800px; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 10pt; white-space: nowrap; } 
    th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
    .name-cell { text-align: left; font-weight: bold; }

    /* 🌟 色の定義（CSS） */
    .vacation-cell { background-color: #ffdddd; font-weight: bold; }    /* / と × の色（薄い赤） */
    .paid-holiday-cell { background-color: #d0f0d0; font-weight: bold; } /* 有休の色（薄い緑） */

    .date-row th { background-color: #cccccc; padding-top: 4px; padding-bottom: 4px; }
    .footer-row { background-color: #f0f0f0; font-weight: bold; }
</style>
</head>
<body>
    <h1 id="mainTitle">スケジュールを読み込み中...</h1>
    
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div id="scheduleTable">データを読み込み中...</div>

<script>
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaYJphnZhb8HkeovOamN2R_LJ9GImdQr8fD_uRqWyFJ0N_JJi3okCjunHA1aFGajXz9MykXYRZYS4K/pub?gid=0&single=true&output=csv'; 
    
    function fetchDataAndDisplay() {
        document.getElementById('mainTitle').textContent = 'データを読み込み中...';
        document.getElementById('scheduleTable').innerHTML = 'データを読み込み中...';
        
        fetchDataFromCSV(PUBLIC_CSV_URL)
            .then(data => {
                if (data.error) {
                    showError({ message: data.error });
                } else {
                    displayData(data);
                }
            })
            .catch(error => {
                showError({ message: `通信エラー: ${error.message}` });
            });
    }

    window.onload = function() {
        fetchDataAndDisplay();
        document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
    };

    /**
     * 引用符と改行を考慮したCSVパース
     */
    async function fetchDataFromCSV(url) {
        try {
            const response = await fetch(url + (url.indexOf('?') > -1 ? '&t=' : '?t=') + Date.now());
            if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
            const csvText = await response.text();

            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"' && inQuotes && nextChar === '"') {
                    currentCell += '"'; i++; 
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentCell.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            if (currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
            }

            if (rows.length < 6) return { error: 'データ構造が正しくありません。' };

            let monthValue = rows[0][1] || "不明な月度";
            const dateHeader = rows[3]; 
            const header = rows[4]; 
            
            const allBodyRows = rows.slice(5);
            const filteredBody = allBodyRows.filter((row, index) => {
                const isLastRow = (index === allBodyRows.length - 1);
                const hasAColumnData = (row[0] && row[0] !== '');
                return hasAColumnData || isLastRow;
            });

            return {
                month: monthValue, 
                dateHeader: dateHeader, 
                header: header, 
                data: filteredBody 
            };

        } catch (e) {
            return { error: `パースエラー: ${e.message}` };
        }
    }

    function displayData(scheduleData) {
        const tableDiv = document.getElementById('scheduleTable');
        document.getElementById('mainTitle').textContent = `${scheduleData.month} 休み希望確認`; 
        
        let html = '<table><thead><tr class="date-row">';
        scheduleData.dateHeader.forEach(d => html += `<th>${d || ''}</th>`);
        html += '</tr><tr>';
        scheduleData.header.forEach(h => html += `<th>${h || ''}</th>`);
        html += '</tr></thead><tbody>';
        
        scheduleData.data.forEach((row, rowIndex) => {
            const isFooter = (rowIndex === scheduleData.data.length - 1);
            const rowClass = isFooter ? ' class="footer-row"' : '';

            html += `<tr${rowClass}>`;
            row.forEach((cell, cellIndex) => {
                const cellTextStr = cell.toString();
                const cellDisplayStr = cellTextStr.replace(/\n/g, '<br>');
                
                if (cellIndex === 1) {
                    html += `<td class="name-cell">${cellDisplayStr}</td>`;
                } else {
                    // 🌟 背景色の条件分岐
                    let cellClass = '';
                    if (cellTextStr === '/' || cellTextStr === '×') {
                        // / と × を同じ赤系（vacation-cell）に設定
                        cellClass = ' class="vacation-cell"';
                    } else if (cellTextStr === '有休') {
                        cellClass = ' class="paid-holiday-cell"';
                    }

                    html += `<td${cellClass}>${cellDisplayStr}</td>`; 
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        tableDiv.innerHTML = html;
    }
    
    function showError(error) {
        document.getElementById('mainTitle').textContent = '🚨 エラー発生';
        document.getElementById('scheduleTable').innerHTML = `<p>${error.message}</p>`;
    }
</script>
</body>
</html>
