<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スケジュール確認</title>
<style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { color: #333; }
    #reloadButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    table { border-collapse: collapse; width: 100%; max-width: 1200px; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 11pt; white-space: nowrap; } 
    th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
    .name-cell { text-align: center; font-weight: bold; } 
    .vacation-cell { background-color: #ffdddd; font-weight: bold; } 
    .date-row th { 
        background-color: #cccccc; 
        padding-top: 4px; 
        padding-bottom: 4px;
    } 
</style>
</head>
<body>
    <h1 id="mainTitle">スケジュールを読み込み中...</h1>
    
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div id="scheduleTable">データを読み込み中...</div>

<script>
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT20u42P9--VV9FuP3y0JpMiqZyAAyDWgmn-EcW5Hnacjm0wjT8kIb2dVOLLzLXTbqWmzR-vGplYxF-/pub?gid=0&single=true&output=csv'; 
    
    const DISPLAY_COL_COUNT = 33;

    function fetchDataAndDisplay() {
        document.getElementById('mainTitle').textContent = 'データを読み込み中...';
        document.getElementById('scheduleTable').innerHTML = 'データを読み込み中...';
        
        fetchDataFromCSV(PUBLIC_CSV_URL)
            .then(data => {
                if (data.error) {
                    showError({ message: data.error });
                } else {
                    displayData(data);
                }
            })
            .catch(error => {
                showError({ message: `データの読み込みに失敗しました: ${error.message}` });
            });
    }

    window.onload = function() {
        fetchDataAndDisplay();
        document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
    };

    async function fetchDataFromCSV(url) {
        try {
            const finalUrl = url + `&t=${new Date().getTime()}`;
            const response = await fetch(finalUrl);
            if (!response.ok) {
                throw new Error(`HTTPエラー: ${response.status}`);
            }
            const csvText = await response.text();
            const rows = csvText.trim().split(/\r?\n/).map(row => row.split(','));
            
            if (rows.length < 6) {
                return { error: 'CSVデータの行数が足りません。' };
            }

            const monthValue = rows[1][1] ? rows[1][1].trim() : ""; 
            const dateHeader = rows[3].map(cell => cell.trim()); 
            const header = rows[4].map(cell => cell.trim()); 
            
            // 【修正箇所】データ本体のフィルタリング
            const dataBody = rows.slice(5) 
                .filter(row => {
                    const firstCell = row[0] ? row[0].trim() : "";
                    const nameCell = row[1] ? row[1].trim() : "";
                    // 1. 名前(B列)が空でないこと
                    // 2. 1列目に「総労働時間」という文字が含まれていないこと
                    return nameCell !== '' && !firstCell.includes("総労働時間");
                })
                .map(row => row.map(cell => cell.trim()));

            return {
                month: monthValue, 
                dateHeader: dateHeader, 
                header: header, 
                data: dataBody 
            };
        } catch (e) {
            return { error: `CSVパースエラー: ${e.message}` };
        }
    }

    function displayData(scheduleData) {
        const tableDiv = document.getElementById('scheduleTable');
        document.getElementById('mainTitle').textContent = `${scheduleData.month}度 休み希望確認`; 
        
        let html = '<table><thead>';
        
        html += '<tr class="date-row">';
        scheduleData.dateHeader.slice(0, DISPLAY_COL_COUNT).forEach(d => {
            html += `<th>${d || ''}</th>`;
        });
        html += '</tr>';

        html += '<tr>';
        scheduleData.header.slice(0, DISPLAY_COL_COUNT).forEach(h => {
            html += `<th>${h || ''}</th>`;
        });
        html += '</tr></thead><tbody>';
        
        scheduleData.data.forEach(row => {
            html += '<tr>';
            row.slice(0, DISPLAY_COL_COUNT).forEach((cell, cellIndex) => {
                const cellTextStr = cell.toString();
                
                if (cellIndex === 0 || cellIndex === 1) {
                    html += `<td class="name-cell">${cellTextStr}</td>`;
                } else {
                    const cellClass = cellTextStr === '/' ? ' class="vacation-cell"' : ''; 
                    html += `<td${cellClass}>${cellTextStr}</td>`; 
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        tableDiv.innerHTML = html;
    }
    
    function showError(error) {
        document.getElementById('mainTitle').textContent = '🚨 データ取得エラー';
        document.getElementById('scheduleTable').innerHTML = `<p style="color: red;">エラー: ${error.message}</p>`;
    }
</script>
</body>
</html>
