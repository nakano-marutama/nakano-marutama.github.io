<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>スケジュール確認</title>
<style>
    /* ページの表示を整えるためのCSS */
    body { font-family: sans-serif; margin: 20px; }
    h1 { color: #333; }
    /* 更新ボタンのスタイル */
    #reloadButton {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
    }
    table { border-collapse: collapse; width: 100%; max-width: 1200px; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 11pt; white-space: nowrap; } 
    /* ヘッダー固定 */
    th { background-color: #e0e0e0; position: sticky; top: 0; z-index: 10; } 
    .name-cell { text-align: left; font-weight: bold; } /* 氏名セル */
    /* 休み（/）のセルを強調 */
    .vacation-cell { background-color: #ffdddd; font-weight: bold; } 
    /* 日付行のヘッダー色 */
    .date-row th { 
        background-color: #cccccc; 
        padding-top: 4px; 
        padding-bottom: 4px;
    } 
</style>
</head>
<body>
    <h1 id="mainTitle">スケジュールを読み込み中...</h1>
    
    <button id="reloadButton">🔄 スケジュールを更新</button>

    <div id="scheduleTable">データを読み込み中...</div>

<script>
    // 🌟 【更新】新しいCSV形式のURL
    const PUBLIC_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaYJphnZhb8HkeovOamN2R_LJ9GImdQr8fD_uRqWyFJ0N_JJi3okCjunHA1aFGajXz9MykXYRZYS4K/pub?gid=0&single=true&output=csv'; 
    
    function fetchDataAndDisplay() {
        document.getElementById('mainTitle').textContent = 'データを読み込み中...';
        document.getElementById('scheduleTable').innerHTML = 'データを読み込み中...';
        
        fetchDataFromCSV(PUBLIC_CSV_URL)
            .then(data => {
                if (data.error) {
                    showError({ message: data.error });
                } else {
                    displayData(data);
                }
            })
            .catch(error => {
                showError({ message: `データの読み込みに失敗しました: ${error.message}` });
            });
    }

    window.onload = function() {
        fetchDataAndDisplay();
        document.getElementById('reloadButton').addEventListener('click', fetchDataAndDisplay);
    };

    /**
     * CSVデータを取得し解析する関数
     */
    async function fetchDataFromCSV(url) {
        try {
            const cacheBuster = url.indexOf('?') > -1 ? `&t=${Date.now()}` : `?t=${Date.now()}`;
            const response = await fetch(url + cacheBuster);
            
            if (!response.ok) {
                throw new Error(`HTTPエラー: ${response.status}`);
            }
            const csvText = await response.text();

            // スクショ2で成功した分割ロジックをベースに、ダブルクォーテーションを適切に処理
            const rows = csvText.trim().split('\n').map(row => {
                // カンマ分割するが、セル内の引用符を削除
                return row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
            });
            
            if (rows.length < 6) {
                return { error: 'CSVデータの行数が足りません。' };
            }

            // 【月度】1行目(rows[0])のB列([1])
            let monthValue = "不明な月";
            if (rows[0] && rows[0][1]) {
                const match = rows[0][1].match(/\d+/);
                monthValue = match ? match[0].padStart(2, '0') + "月度" : rows[0][1];
            }
            
            // 【ヘッダー】日付は4行目、曜日は5行目（インデックスは3と4）
            const dateHeader = rows[3] || [];
            const header = rows[4] || []; 
            
            // 【データ本体】6行目(インデックス5)以降
            const dataBody = rows.slice(5) 
                .filter(row => row[0] && row[0] !== '') // 1列目（職種や名前）がある行のみ
                .map(row => row);

            return {
                month: monthValue, 
                dateHeader: dateHeader, 
                header: header, 
                data: dataBody 
            };

        } catch (e) {
            return { error: `CSVパースエラー: ${e.message}` };
        }
    }

    function displayData(scheduleData) {
        const tableDiv = document.getElementById('scheduleTable');
        document.getElementById('mainTitle').textContent = `${scheduleData.month} 休み希望確認`; 
        
        let html = '<table><thead><tr class="date-row">';
        // 日付行
        scheduleData.dateHeader.forEach(d => html += `<th>${d || ''}</th>`);
        html += '</tr><tr>';
        // 曜日/項目行
        scheduleData.header.forEach(h => html += `<th>${h || ''}</th>`);
        html += '</tr></thead><tbody>';
        
        // データ行
        scheduleData.data.forEach(row => {
            html += '<tr>';
            row.forEach((cell, cellIndex) => {
                const cellTextStr = cell.toString().replace(/\n/g, '<br>');
                // 名前列の判定（2列目であることが多いためcellIndex === 1）
                if (cellIndex === 1) {
                    html += `<td class="name-cell">${cellTextStr}</td>`;
                } else {
                    const cellClass = cellTextStr === '/' ? ' class="vacation-cell"' : ''; 
                    html += `<td${cellClass}>${cellTextStr}</td>`; 
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        tableDiv.innerHTML = html;
    }
    
    function showError(error) {
        document.getElementById('mainTitle').textContent = '🚨 データ取得エラー';
        document.getElementById('scheduleTable').innerHTML = `<p>${error.message}</p>`;
    }
</script>
</body>
</html>
